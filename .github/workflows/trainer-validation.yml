name: Trainer validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VRAM_STREAM_TEST_TRAINER: "1"
      OMP_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0+cpu"
      - name: Install checkout and Trainer dependencies
        run: python -m pip install ".[test]" "transformers==4.57.3" "accelerate==1.12.0"
      - name: Compare real Trainer runs
        run: python -m pytest -q -s tests/test_training.py::test_real_hugging_face_trainer
